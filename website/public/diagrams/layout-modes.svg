<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-labelledby="title desc">
<title id="title">Layout structures</title>
<desc id="desc">Four schematic structures for auto, flow, manual row, and a column with a nested auto region. The boxes do not show measured device sizes.</desc>
<style>text{font-family:system-ui,sans-serif;fill:#153542} .label{font-weight:650;font-size:16px} .item{font-size:14px;text-anchor:middle;dominant-baseline:middle}</style>
<g transform="translate(8 8)">
<rect width="344" height="184" rx="12" fill="#f3f7f9" stroke="#bdced8"/>
