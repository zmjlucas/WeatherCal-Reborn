<rect x="16" y="44" width="304" height="42" rx="6" fill="#d5edf1" stroke="#8fbac3"/>
<text x="168.0" y="65.0" class="item">rain</text>
<rect x="16" y="94" width="148" height="72" rx="6" fill="#d5edf1" stroke="#8fbac3"/>
<text x="90.0" y="130.0" class="item">current</text>
<rect x="172" y="94" width="148" height="72" rx="6" fill="#d5edf1" stroke="#8fbac3"/>
<text x="246.0" y="130.0" class="item">future</text>
</g>
